<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	ServerName pypi.camera
	DocumentRoot /var/www/html/pypi-web/public

	<Directory /var/www/html/pypi-web/public/>
			Options Indexes FollowSymLinks
			AllowOverride All
			Require all granted
	</Directory>

	 # Reverse proxy setup for Mediamtx WebRTC stream
	ProxyPass /live/ http://localhost:8889/live/
	ProxyPassReverse /live/ http://localhost:8889/live/

	# Enable WebSocket support (important for WebRTC)
	ProxyPass /ws/ ws://localhost:8889/ws/
	ProxyPassReverse /ws/ ws://localhost:8889/ws/

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName pypi.camera
    DocumentRoot /var/www/html/pypi-web/public

    <Directory /var/www/html/pypi-web/public/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse proxy setup for Mediamtx WebRTC stream
    ProxyPass /live/ http://localhost:8889/live/
    ProxyPassReverse /live/ http://localhost:8889/live/

    # Enable WebSocket support (important for WebRTC)
    ProxyPass /ws/ ws://localhost:8889/ws/
    ProxyPassReverse /ws/ ws://localhost:8889/ws/

    # SSL configuration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/local.crt
    SSLCertificateKeyFile /etc/apache2/ssl/local.key

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>